[package]
name = "beatlab"
version = "0.2.0"
edition = "2021"
description = "High-quality self-hosted music streaming server in Rust with auto-playlists, smart recommendations, personal mixes, moods, and Subsonic/OpenSubsonic API"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["cors"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.21"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
md-5 = "0.10"
sha1 = "0.10"
uuid = { version = "1", features = ["v4"] }
hex = "0.4"
rand = "0.8"
regex = "1"
urlencoding = "2"
bytes = "1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
http-range-header = "0.4"
flate2 = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
