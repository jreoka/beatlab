[package]
name = "beatlab"
version = "0.3.0"
edition = "2021"
description = "Self-hosted music streaming platform in Rust with open sign-up, Subsonic/OpenSubsonic & Navidrome APIs, smart mixes, synced lyrics, and a full web music player"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["cors"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.21"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
hex = "0.4"
rand = "0.8"
url = "2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
webauthn-rs = { version = "0.5.5", features = ["danger-allow-state-serialisation"] }
urlencoding = "2"
bytes = "1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
flate2 = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
