app = "dill-beatlab"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  BEATLAB_ADDR = "0.0.0.0:4533"
  BEATLAB_DATA = "/data"
  BEATLAB_CACHE_GB = "5.0"
  RUST_LOG = "info"

[http_service]
  internal_port = 4533
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/health"

[mounts]
  source = "beatlab_data"
  destination = "/data"
  initial_size = "10gb"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
