app = "dill-beatlab"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  BEATLAB_ADDR = "0.0.0.0:4533"
  BEATLAB_DATA = "/data"
  BEATLAB_CACHE_GB = "10"
  BEATLAB_ORIGIN = "https://music.dill.moe"
  ADMIN_USERNAME = "cross"
  BEATLAB_S3_BUCKET = "beatlab"
  # BEATLAB_S3_ENDPOINT = "https://your-account.r2.cloudflarestorage.com"
  BEATLAB_S3_REGION = "auto"
  # BEATLAB_S3_ACCESS_KEY_ID = "..."
  # BEATLAB_S3_SECRET_ACCESS_KEY = "..."
  BEATLAB_S3_MAX_GB = "100"
  # Optional OpenAI-compatible overnight LLM curator (customizes Home, Explore & Mixes daily)
  # BEATLAB_LLM_ENDPOINT = "https://api.openai.com/v1"
  # BEATLAB_LLM_API_KEY = "..."
  # BEATLAB_LLM_MODEL = "gpt-4o-mini"
  # BEATLAB_LLM_REFRESH_HOUR = "4"
  # BEATLAB_LLM_TEMPERATURE = "0.85"
  # BEATLAB_LLM_MAX_TOKENS = "8192"
  # BEATLAB_LLM_TIMEOUT_SECS = "120"
  # BEATLAB_LLM_REASONING_EFFORT = "low"
  # BEATLAB_LLM_SYSTEM_PROMPT = ""
  RUST_LOG = "info"
  # Keep yt-dlp's player/signature cache on the volume so restarts and
  # deploys don't make the first plays re-fetch it.
  XDG_CACHE_HOME = "/data/.cache"

[http_service]
  internal_port = 4533
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/health"

[mounts]
  source = "beatlab_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "512mb"
