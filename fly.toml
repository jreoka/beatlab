app = "dill-beatlab"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  BEATLAB_ADDR = "0.0.0.0:4533"
  BEATLAB_DATA = "/data"
  BEATLAB_CACHE_GB = "10"
  BEATLAB_ORIGIN = "https://music.dill.moe"
  ADMIN_USERNAME = "cross"
  BEATLAB_S3_BUCKET = "beatlab"
  # BEATLAB_S3_ENDPOINT = "https://your-account.r2.cloudflarestorage.com"
  BEATLAB_S3_REGION = "auto"
  # BEATLAB_S3_ACCESS_KEY_ID = "..."
  # BEATLAB_S3_SECRET_ACCESS_KEY = "..."
  BEATLAB_S3_MAX_GB = "100"
  RUST_LOG = "info"

[http_service]
  internal_port = 4533
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/health"

[mounts]
  source = "beatlab_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "512mb"
