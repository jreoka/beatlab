app = "dill-beatlab"
primary_region = "ord"
swap_size_mb = 512

[build]
  dockerfile = "Dockerfile"

[env]
  BEATLAB_ADDR = "0.0.0.0:4533"
  BEATLAB_DATA = "/data"
  BEATLAB_CACHE_GB = "5"
  BEATLAB_ORIGIN = "https://music.dill.moe"
  ADMIN_USERNAME = "cross"
  BEATLAB_S3_BUCKET = "shy-silence-1658"
  # BEATLAB_S3_ENDPOINT = "https://your-account.r2.cloudflarestorage.com"
  BEATLAB_S3_REGION = "auto"
  # BEATLAB_S3_ACCESS_KEY_ID = "..."
  # BEATLAB_S3_SECRET_ACCESS_KEY = "..."
  BEATLAB_S3_MAX_GB = "100"
  # Optional OpenAI-compatible overnight LLM curator (customizes Home, Explore & Mixes daily)
  BEATLAB_LLM_ENDPOINT = "https://openrouter.ai/api/v1"
  # BEATLAB_LLM_API_KEY = "..."
  BEATLAB_LLM_MODEL = "baidu/ernie-5.5-flash-preview:free"
  # BEATLAB_LLM_REFRESH_HOUR = "4"
  RUST_LOG = "info"
  # Limit glibc malloc arenas so worker/blocking threads don't retain fragmented
  # RSS across 8+ 64MB arenas on a constrained VM.
  MALLOC_ARENA_MAX = "2"

[http_service]
  internal_port = 4533
  force_https = true
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/health"

[mounts]
  source = "beatlab_data"
  destination = "/data"
  initial_size = 10

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "1gb"