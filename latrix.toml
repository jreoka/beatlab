app = "beatlab"

[build]
dockerfile = "Dockerfile"

[env]
ADMIN_USERNAME = "cross"
BEATLAB_ADDR = "0.0.0.0:4533"
BEATLAB_CACHE_GB = "10"
BEATLAB_DATA = "/data"
BEATLAB_ORIGIN = "https://music.dill.moe"
BEATLAB_S3_BUCKET = "beatlab"
BEATLAB_S3_MAX_GB = "200"
BEATLAB_S3_REGION = "auto"
MALLOC_ARENA_MAX = "2"
RUST_LOG = "info"
XDG_CACHE_HOME = "/data/.cache"

[http]
port = 4533
domains = ["music.dill.moe"]
health = "/health"
force_https = true

[scale]
count = 1
cpu = 2.0
memory = "1024MB"

[[volumes]]
name = "beatlab-data"
path = "/data"
copies = 2
sync = "30s"

[deploy]
strategy = "rolling"
health_timeout = "90s"
stop_timeout = "10s"
