<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beatlab — Server Admin</title>
<style>
  :root {
    --bg: #0b0d12; --bg2: #121620; --bg3: #1a2030; --border: #252c3f;
    --text: #eef1f8; --muted: #8b95b0; --accent: #6366f1; --accent2: #22d3ee;
    --green: #10b981;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; }
  header { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; }
  .brand { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; display: flex; align-items: center; gap: 10px; }
  .brand span { background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .api-pill { font-size: 12px; color: var(--accent2); background: var(--bg3); border: 1px solid var(--border); padding: 6px 12px; border-radius: 999px; }
  main { max-width: 920px; margin: 0 auto; padding: 28px 24px 48px; }
  h1 { font-size: 26px; font-weight: 800; margin-bottom: 20px; }
  h3 { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .btn { background: var(--accent); color: #fff; border: none; padding: 10px 18px; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; }
  .btn:hover { opacity: 0.9; }
  .btn-ghost { background: var(--bg3); color: var(--text); border: 1px solid var(--border); padding: 7px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .btn-ghost:hover { border-color: var(--accent); }
  .admin-panel { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 18px; }
  .src-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .src-row:last-child { border-bottom: none; }
  .input { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 8px; font-size: 14px; }
  .input:focus { outline: none; border-color: var(--accent); }
  .form-row { display: flex; gap: 10px; margin: 12px 0; flex-wrap: wrap; }
  .err-msg { color: #f87171; font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>
<header>
  <div class="brand">🎵 <span>Beatlab</span></div>
  <div style="display:flex;align-items:center;gap:10px">
    <div class="api-pill">Subsonic API: /rest</div>
    <button id="logoutBtn" class="btn-ghost" style="display:none" onclick="logoutAdmin()">Log Out</button>
  </div>
</header>

<main id="main">
  <h1>Sources & Server Admin</h1>
  <p style="color:var(--muted)">Loading server status...</p>
</main>

<script>
function esc(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function setLoggedInUI(loggedIn) {
  const btn = document.getElementById('logoutBtn');
  if (btn) btn.style.display = loggedIn ? 'inline-block' : 'none';
}

function renderLogin(errMsg = '') {
  setLoggedInUI(false);
  document.getElementById('main').innerHTML = `
    <div class="admin-panel" style="max-width:420px;margin:48px auto">
      <h1 style="font-size:22px;margin-bottom:8px">Admin Sign In</h1>
      <p style="color:var(--muted);font-size:13px;margin-bottom:16px">Enter the server admin password to access Sources &amp; Server Admin.</p>
      <form onsubmit="loginAdmin(event)">
        <div class="form-row">
          <input id="adminPass" class="input" type="password" style="flex:1" placeholder="Admin password" autocomplete="current-password" autofocus>
        </div>
        <button id="loginBtn" class="btn" type="submit" style="width:100%">Sign In</button>
      </form>
      <div id="loginErr" class="err-msg">${esc(errMsg)}</div>
    </div>`;
}

async function loginAdmin(e) {
  if (e) e.preventDefault();
  const passEl = document.getElementById('adminPass');
  const errEl = document.getElementById('loginErr');
  const btn = document.getElementById('loginBtn');
  const password = passEl ? passEl.value : '';
  if (!password) {
    errEl.textContent = 'Password is required.';
    return;
  }
  errEl.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Signing in...';
  try {
    const res = await fetch('/admin/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({password})
    });
    if (res.ok) {
      renderAdmin();
      return;
    }
    const data = await res.json().catch(() => ({}));
    errEl.textContent = data.error || 'Invalid admin password';
  } catch (err) {
    errEl.textContent = 'Network error while signing in';
  }
  btn.disabled = false;
  btn.textContent = 'Sign In';
}

async function logoutAdmin() {
  try {
    await fetch('/admin/api/logout', {method: 'POST'});
  } finally {
    renderLogin();
  }
}

async function renderAdmin() {
  const res = await fetch('/admin/api/status');
  if (res.status === 401) {
    renderLogin();
    return;
  }
  if (!res.ok) {
    document.getElementById('main').innerHTML = `<h1>Sources & Server Admin</h1><p class="err-msg">Failed to load server status.</p>`;
    return;
  }
  setLoggedInUI(true);
  const d = await res.json();
  let html = `<h1>Sources & Server Admin</h1>
    <div class="admin-panel">
      <h3>Catalog & Quality</h3>
      <p style="margin:8px 0;color:var(--muted)">Version: ${esc(d.version)} • Total Tracks: <b>${d.tracks}</b> • Lossless: <b>${d.lossless_tracks}</b> • FFmpeg: <b>${d.ffmpeg ? 'Ready' : 'Not found'}</b></p>
      <p style="margin:8px 0;color:var(--muted)">Audio Cache: <b>${(d.cache_bytes / (1024*1024)).toFixed(1)} MB</b> / ${(d.cache_budget_bytes / (1024*1024*1024)).toFixed(1)} GB
        <button class="btn-ghost" style="margin-left:10px" onclick="clearCache()">Clear Cache</button></p>
    </div>
    <div class="admin-panel">
      <h3>Local Music Folders (FLAC / WAV / ALAC / MP3)</h3>
      <div class="form-row">
        <input id="dirInput" class="input" style="flex:1" placeholder="C:\\Users\\you\\Music">
        <button class="btn" onclick="addLocalDir()">Add & Scan</button>
        <button class="btn-ghost" onclick="scanLocal()">Rescan</button>
      </div>
      <div style="font-size:13px;color:var(--muted)">${d.local_dirs.length ? d.local_dirs.map(esc).join('<br>') : 'No local folders added yet.'}</div>
    </div>
    <div class="admin-panel">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h3>Soulseek Sign In</h3>
        <span style="font-size:13px;color:${d.soulseek && d.soulseek.connected ? 'var(--green)' : 'var(--muted)'}">
          ${d.soulseek && d.soulseek.connected ? 'Connected as ' + esc(d.soulseek.username) : (d.soulseek && d.soulseek.connecting ? 'Connecting...' : 'Not connected')}
        </span>
      </div>
      <div class="form-row">
        <input id="slskUser" class="input" style="flex:1;min-width:160px" placeholder="Soulseek username" value="${esc(d.soulseek && d.soulseek.username ? d.soulseek.username : '')}">
        <input id="slskPass" class="input" type="password" style="flex:1;min-width:160px" placeholder="Password">
        <input id="slskServer" class="input" style="flex:1;min-width:180px" placeholder="server.slsknet.org:2242" value="${esc(d.soulseek && d.soulseek.server ? d.soulseek.server : 'server.slsknet.org:2242')}">
      </div>
      <div style="display:flex;gap:10px;align-items:center">
        <button id="slskBtn" class="btn" onclick="connectSoulseek()">${d.soulseek && d.soulseek.connected ? 'Reconnect' : 'Sign In & Connect'}</button>
        ${d.soulseek && d.soulseek.connected ? `<button class="btn-ghost" onclick="disconnectSoulseek()">Disconnect</button>` : ''}
      </div>
      <div id="slskErr" class="err-msg">${d.soulseek && d.soulseek.last_error ? esc(d.soulseek.last_error) : ''}</div>
    </div>
    <div class="admin-panel"><h3>Active Sources</h3>`;
  d.sources.forEach(s => {
    html += `<div class="src-row"><b>${esc(s.name)}</b><span style="color:${s.available ? 'var(--green)' : 'var(--muted)'}">${esc(s.status)}</span></div>`;
  });
  html += `</div>`;
  if (d.users && d.users.length) {
    html += `<div class="admin-panel"><h3>Users</h3>`;
    d.users.forEach(u => {
      html += `<div class="src-row"><b>${esc(u.username)}</b><span style="color:var(--muted)">${u.is_admin ? 'Admin' : 'User'}</span></div>`;
    });
    html += `</div>`;
  }
  document.getElementById('main').innerHTML = html;
}

async function addLocalDir() {
  const path = document.getElementById('dirInput').value;
  const res = await fetch('/admin/api/dirs', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({path})});
  if (res.status === 401) { renderLogin(); return; }
  if (res.ok) { renderAdmin(); } else { alert('Folder not found'); }
}

async function scanLocal() {
  const res = await fetch('/admin/api/scan', {method:'POST'});
  if (res.status === 401) { renderLogin(); return; }
  renderAdmin();
}

async function clearCache() {
  const res = await fetch('/admin/api/cache/clear', {method:'POST'});
  if (res.status === 401) { renderLogin(); return; }
  renderAdmin();
}

async function connectSoulseek() {
  const username = document.getElementById('slskUser').value.trim();
  const password = document.getElementById('slskPass').value;
  const server = document.getElementById('slskServer').value.trim();
  const errEl = document.getElementById('slskErr');
  const btn = document.getElementById('slskBtn');
  if (!username || !password) {
    errEl.textContent = 'Username and password are required.';
    return;
  }
  errEl.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Connecting...';
  try {
    const res = await fetch('/admin/api/soulseek/connect', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username, password, server: server || null})
    });
    if (res.status === 401) {
      renderLogin();
      return;
    }
    const data = await res.json();
    if (!res.ok || !data.ok) {
      errEl.textContent = data.error || 'Failed to connect to Soulseek';
      btn.disabled = false;
      btn.textContent = 'Sign In & Connect';
      return;
    }
    renderAdmin();
  } catch (e) {
    errEl.textContent = 'Network error while connecting to Soulseek';
    btn.disabled = false;
    btn.textContent = 'Sign In & Connect';
  }
}

async function disconnectSoulseek() {
  const res = await fetch('/admin/api/soulseek/disconnect', {method:'POST'});
  if (res.status === 401) { renderLogin(); return; }
  renderAdmin();
}

renderAdmin();
</script>
</body>
</html>
