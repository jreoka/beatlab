<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Beatlab Admin</title>
  <link rel="icon" type="image/svg+xml" href="/web/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
  <style>
    :root {
      --bg:#08090c; --surface:#0f1116; --surface-2:#161920; --surface-3:#1e222b;
      --border:#1e222b; --border-bright:#2e3442;
      --text:#f1f3f5; --muted:#8b93a5; --dim:#5e6678;
      --accent:#1ed760; --accent-soft:rgba(30,215,96,.12); --accent-line:rgba(30,215,96,.35);
      --danger:#f43f5e; --danger-soft:rgba(244,63,94,.12); --warn:#f5b54a; --warn-soft:rgba(245,181,74,.12);
      --info:#60a5fa; --info-soft:rgba(96,165,250,.12); --violet:#a78bfa; --violet-soft:rgba(167,139,250,.12);
      --radius:14px; --radius-sm:9px;
      --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    }
    * { box-sizing:border-box; }
    html,body { height:100%; }
    body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 var(--font); -webkit-font-smoothing:antialiased; }
    a { color:var(--accent); text-decoration:none; }
    button { font:inherit; cursor:pointer; color:inherit; }
    .hidden { display:none !important; }
    .muted { color:var(--muted); }

    /* ---------- layout ---------- */
    .shell { display:grid; grid-template-columns:240px 1fr; min-height:100vh; }
    aside { position:sticky; top:0; height:100vh; display:flex; flex-direction:column; gap:6px; padding:22px 14px; border-right:1px solid var(--border); background:var(--surface); }
    .brand { display:flex; align-items:center; gap:10px; padding:4px 10px 22px; font-weight:800; font-size:18px; letter-spacing:-.01em; }
    .logo { width:30px; height:30px; border-radius:9px; display:grid; place-items:center; background:var(--accent); }
    .logo svg { width:16px; height:16px; }
    .badge { font-size:10px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); background:var(--accent-soft); border-radius:99px; padding:3px 8px; }
    .nav-label { font-size:10.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--dim); padding:6px 12px; }
    .tab { display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:var(--radius-sm); color:var(--muted); font-weight:600; transition:background .15s,color .15s; }
    .tab svg { width:18px; height:18px; flex:none; opacity:.85; }
    .tab:hover { background:var(--surface-2); color:var(--text); }
    .tab.active { background:var(--accent-soft); color:var(--accent); }
    .aside-foot { margin-top:auto; display:flex; flex-direction:column; gap:8px; padding:14px 6px 0; border-top:1px solid var(--border); }
    .me { display:flex; align-items:center; gap:10px; padding:6px; }
    .me .meta { min-width:0; }
    .me .name { font-weight:700; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .me .role { font-size:11.5px; color:var(--dim); }
    .foot-actions { display:flex; gap:8px; }
    .foot-actions > * { flex:1; text-align:center; }

    main { min-width:0; padding:34px 40px 70px; }
    .page-head { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:26px; flex-wrap:wrap; }
    .page-head h1 { margin:0; font-size:26px; font-weight:800; letter-spacing:-.02em; }
    .page-head p { margin:4px 0 0; color:var(--muted); }
    .content { max-width:1180px; }

    /* ---------- controls ---------- */
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:7px; border:1px solid var(--border-bright); background:var(--surface-2); border-radius:var(--radius-sm); padding:8px 13px; font-size:12.5px; font-weight:700; color:var(--text); transition:border-color .15s,background .15s,color .15s; }
    .btn:hover { border-color:var(--accent-line); color:var(--accent); }
    .btn.primary { background:var(--accent); border-color:var(--accent); color:#04130a; }
    .btn.primary:hover { background:#3be477; border-color:#3be477; color:#04130a; }
    .btn:disabled { opacity:.4; cursor:not-allowed; }
    .btn svg { width:14px; height:14px; }
    .mini { border:1px solid var(--border-bright); background:transparent; color:var(--text); border-radius:8px; padding:5px 9px; font-size:11.5px; font-weight:700; white-space:nowrap; transition:border-color .15s,color .15s,background .15s; }
    .mini:hover { border-color:var(--accent-line); color:var(--accent); background:var(--accent-soft); }
    .mini.danger { color:var(--danger); border-color:rgba(244,63,94,.35); }
    .mini.danger:hover { background:var(--danger-soft); border-color:var(--danger); color:var(--danger); }
    .mini:disabled { opacity:.4; cursor:not-allowed; }
    .search { position:relative; width:100%; max-width:340px; }
    .search svg { position:absolute; left:12px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--dim); pointer-events:none; }
    .search input { width:100%; background:var(--surface); border:1px solid var(--border-bright); border-radius:var(--radius-sm); padding:10px 12px 10px 36px; color:var(--text); font:inherit; outline:none; transition:border-color .15s; }
    .search input:focus { border-color:var(--accent); }

    /* ---------- cards ---------- */
    .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; }
    .stats { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px; }
    .stat { display:flex; flex-direction:column; gap:14px; transition:border-color .2s; }
    .stat:hover { border-color:var(--border-bright); }
    .stat-top { display:flex; align-items:center; justify-content:space-between; }
    .stat .k { color:var(--muted); font-size:12.5px; font-weight:600; }
    .ico { width:34px; height:34px; border-radius:10px; display:grid; place-items:center; background:var(--accent-soft); color:var(--accent); }
    .ico svg { width:17px; height:17px; }
    .ico.info { background:var(--info-soft); color:var(--info); }
    .ico.warn { background:var(--warn-soft); color:var(--warn); }
    .ico.violet { background:var(--violet-soft); color:var(--violet); }
    .ico.danger { background:var(--danger-soft); color:var(--danger); }
    .stat .v { font-size:28px; font-weight:800; letter-spacing:-.02em; line-height:1.1; font-variant-numeric:tabular-nums; }
    .stat .s { color:var(--dim); font-size:12px; margin-top:4px; }
    .group-title { font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); margin:30px 0 12px; }
    .group-title:first-child { margin-top:0; }

    /* ---------- table ---------- */
    .table-card { padding:0; overflow:hidden; }
    .table-toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 18px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
    .table-scroll { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; }
    th,td { text-align:left; padding:13px 18px; border-bottom:1px solid var(--border); font-size:13px; vertical-align:middle; }
    th { color:var(--dim); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; background:var(--surface); }
    tbody tr { transition:background .12s; }
    tbody tr:hover td { background:rgba(255,255,255,.018); }
    tbody tr:last-child td { border-bottom:0; }
    .user-cell { display:flex; align-items:center; gap:11px; }
    .avatar { width:34px; height:34px; border-radius:50%; display:grid; place-items:center; font-weight:800; font-size:13px; flex:none; color:#08090c; }
    .avatar.lg { width:52px; height:52px; font-size:19px; }
    .user-cell .name { font-weight:700; }
    .user-cell .sub { color:var(--dim); font-size:11.5px; }
    .pill { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:3px 9px; border-radius:99px; color:var(--muted); background:var(--surface-3); white-space:nowrap; }
    .pill::before { content:''; width:6px; height:6px; border-radius:50%; background:currentColor; }
    .pill.plain::before { display:none; }
    .pill.on { color:var(--accent); background:var(--accent-soft); }
    .pill.off { color:var(--dim); }
    .pill.del { color:var(--danger); background:var(--danger-soft); }
    .pill.admin { color:var(--violet); background:var(--violet-soft); }
    .activity b { font-weight:700; }
    .activity .sub { color:var(--dim); font-size:11.5px; }
    .actions { display:flex; gap:5px; flex-wrap:wrap; justify-content:flex-end; }
    .pager { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 18px; border-top:1px solid var(--border); flex-wrap:wrap; }
    .pager .info { color:var(--muted); font-size:12px; }
    .pager .btns { display:flex; gap:6px; }
    .empty { padding:40px 22px; text-align:center; color:var(--muted); }

    /* ---------- cache ---------- */
    .panel-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:16px; }
    .tier-head { display:flex; align-items:center; gap:12px; margin-bottom:18px; }
    .tier-head .t { font-weight:700; }
    .tier-head .st { color:var(--dim); font-size:12px; }
    .tier-head .pill { margin-left:auto; }
    .big { font-size:30px; font-weight:800; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
    .usage-bar { position:relative; height:8px; border-radius:99px; background:var(--surface-3); overflow:hidden; margin:14px 0 6px; }
    .usage-fill { height:100%; border-radius:99px; background:var(--accent); transition:width .6s ease; }
    .usage-fill.warn { background:var(--warn); }
    .usage-bar i { position:absolute; top:0; bottom:0; width:2px; background:var(--warn); }
    .progress-label { display:flex; justify-content:space-between; font-size:11.5px; color:var(--muted); margin-bottom:14px; }
    .stat-row { display:flex; justify-content:space-between; gap:14px; padding:9px 0; border-bottom:1px solid var(--border); font-size:13px; }
    .stat-row:last-child { border-bottom:0; }
    .stat-row .label { color:var(--muted); }
    .stat-row .value { font-weight:700; font-variant-numeric:tabular-nums; text-align:right; word-break:break-all; }
    .sub-label { margin:18px 0 4px; font-size:11px; font-weight:700; color:var(--dim); text-transform:uppercase; letter-spacing:.07em; }

    /* ---------- config ---------- */
    .kv { display:flex; justify-content:space-between; gap:24px; padding:13px 0; border-bottom:1px solid var(--border); }
    .kv:last-child { border-bottom:0; }
    .kv span:first-child { color:var(--muted); }
    .kv span:last-child { font-weight:600; text-align:right; word-break:break-word; }
    .config-card { padding:6px 22px; }
    .config-card .kv span:last-child { font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:12.5px; font-weight:500; }

    /* ---------- gate / modal / toast ---------- */
    .gate { min-height:100vh; display:grid; place-items:center; padding:20px; }
    .gate .card { max-width:420px; text-align:center; padding:34px 30px; }
    .gate .logo { width:48px; height:48px; border-radius:14px; margin:0 auto 18px; }
    .gate .logo svg { width:24px; height:24px; }
    .gate h2 { margin:0 0 8px; font-size:20px; }
    .gate p { margin:0 0 22px; }
    .backdrop { position:fixed; inset:0; background:rgba(3,4,6,.8); display:flex; align-items:center; justify-content:center; padding:18px; z-index:20; animation:fade .15s ease; }
    .modal { background:var(--surface); border:1px solid var(--border-bright); border-radius:18px; width:min(720px,100%); max-height:88vh; overflow:auto; animation:pop .18s ease; }
    .modal-head { display:flex; align-items:center; gap:14px; padding:22px 24px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--surface); z-index:1; }
    .modal-head h3 { margin:0; font-size:18px; }
    .modal-head .close { margin-left:auto; width:34px; height:34px; border-radius:50%; background:var(--surface-2); border:0; color:var(--muted); font-size:15px; }
    .modal-head .close:hover { color:var(--text); background:var(--surface-3); }
    #modal-body { padding:20px 24px 26px; }
    .detail-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
    .detail { background:var(--surface-2); border-radius:var(--radius-sm); padding:12px 14px; }
    .detail .k { color:var(--dim); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; }
    .detail .v { font-weight:700; margin-top:3px; word-break:break-word; }
    .modal h4 { margin:24px 0 10px; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); }
    .list-row { display:flex; justify-content:space-between; gap:16px; padding:11px 0; border-bottom:1px solid var(--border); font-size:13px; }
    .list-row:last-child { border-bottom:0; }
    .list-row .when { color:var(--dim); white-space:nowrap; font-size:12px; }
    .field { display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
    .field label { font-size:12px; font-weight:700; color:var(--muted); }
    .input-row { display:flex; gap:8px; }
    .input-row input { flex:1; min-width:0; background:var(--surface-2); border:1px solid var(--border-bright); border-radius:var(--radius-sm); padding:10px 12px; color:var(--text); font:inherit; outline:none; transition:border-color .15s; }
    .input-row input:focus { border-color:var(--accent); }
    .field .hint { font-size:12px; color:var(--dim); }
    .check-row { display:flex; align-items:center; gap:9px; margin:14px 0 22px; font-size:13px; color:var(--text); cursor:pointer; user-select:none; }
    .check-row input { accent-color:var(--accent); width:15px; height:15px; margin:0; cursor:pointer; }
    .modal-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:20px; }
    .secret-box { display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--surface-2); border:1px solid var(--accent-line); border-radius:var(--radius-sm); padding:12px 14px; margin:14px 0; }
    .secret-box code { font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:14px; font-weight:700; color:var(--accent); word-break:break-all; user-select:all; }
    #toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--surface-3); border:1px solid var(--border-bright); border-radius:12px; padding:11px 18px; z-index:40; font-weight:600; max-width:calc(100% - 32px); word-break:break-all; animation:toastIn .18s ease; }
    @keyframes fade { from { opacity:0; } }
    @keyframes pop { from { opacity:0; } }
    @keyframes toastIn { from { opacity:0; transform:translate(-50%,6px); } }

    /* ---------- responsive ---------- */
    @media (max-width:900px) {
      .shell { grid-template-columns:1fr; }
      aside { position:sticky; height:auto; flex-direction:row; align-items:center; gap:4px; padding:10px 16px; border-right:0; border-bottom:1px solid var(--border); overflow-x:auto; z-index:10; background:var(--surface); }
      .brand { padding:0 10px 0 0; font-size:16px; }
      .brand .badge, .nav-label, .aside-foot .me { display:none; }
      .tab { padding:8px 11px; white-space:nowrap; }
      .tab span { display:none; }
      .aside-foot { margin:0 0 0 auto; padding:0; border:0; flex-direction:row; }
      .foot-actions .btn { padding:7px 10px; }
      main { padding:22px 16px 60px; }
      th:nth-child(3), td:nth-child(3), th:nth-child(5), td:nth-child(5) { display:none; }
    }
    @media (max-width:600px) {
      th:nth-child(4), td:nth-child(4) { display:none; }
      .panel-grid { grid-template-columns:1fr; }
      .actions { max-width:150px; }
    }
  </style>
</head>

  <div id="gate" class="gate hidden">
    <div class="card">
      <div class="logo"><svg><use href="#i-logo"/></svg></div>
      <h2 id="gate-title">Sign in required</h2>
      <p id="gate-text" class="muted"></p>
      <a class="btn primary" href="/">Open the Beatlab player</a>
    </div>
  </div>

  <div id="panel" class="shell hidden">
    <aside>
      <div class="brand"><div class="logo"><svg><use href="#i-logo"/></svg></div> Beatlab <span class="badge">Admin</span></div>
      <div class="nav-label">Manage</div>
      <a class="tab active" href="/admin/overview" data-tab="overview"><svg><use href="#i-grid"/></svg><span>Overview</span></a>
      <a class="tab" href="/admin/users" data-tab="users"><svg><use href="#i-users"/></svg><span>Users</span></a>
      <a class="tab" href="/admin/cache" data-tab="cache"><svg><use href="#i-db"/></svg><span>Cache</span></a>
      <a class="tab" href="/admin/config" data-tab="config"><svg><use href="#i-cog"/></svg><span>Configuration</span></a>
      <div class="aside-foot">
        <div class="me"><div id="me-avatar" class="avatar">A</div><div class="meta"><div id="head-user" class="name">admin</div><div class="role">Administrator</div></div></div>
        <div class="foot-actions">
          <a class="btn" href="/" title="Back to app"><svg><use href="#i-back"/></svg><span>App</span></a>
          <button class="btn" onclick="signOut()" title="Sign out"><svg><use href="#i-out"/></svg><span>Sign out</span></button>
        </div>
      </div>
    </aside>

    <main>
      <div class="content">
        <div class="page-head">
          <div><h1 id="page-title">Overview</h1><p id="page-sub">A snapshot of your Beatlab server.</p></div>
          <button class="btn" onclick="reload()"><svg><use href="#i-refresh"/></svg>Refresh</button>
        </div>

        <section id="tab-overview">
          <div id="overview-cards"></div>
        </section>

        <section id="tab-users" class="hidden">
          <div class="card table-card">
            <div class="table-toolbar">
              <label class="search"><svg><use href="#i-search"/></svg><input id="user-search" type="search" placeholder="Search users…" oninput="state.userPage=1;renderUsers()" /></label>
              <span id="users-count" class="muted"></span>
            </div>
            <div id="users-wrap" class="table-scroll"></div>
            <div id="users-pager" class="pager"></div>
          </div>
        </section>

        <section id="tab-cache" class="hidden">
          <div id="cache-box" class="panel-grid"></div>
        </section>

        <section id="tab-config" class="hidden">
          <div id="config-box" class="card config-card"></div>
        </section>
      </div>
    </main>
  </div>

  <div id="modal" class="backdrop hidden" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-head"><div id="modal-avatar"></div><div><h3 id="modal-title">User details</h3><div id="modal-sub" class="muted" style="font-size:12.5px"></div></div><button class="close" onclick="closeModal()" aria-label="Close">✕</button></div>
      <div id="modal-body"></div>
    </div>
  </div>
  <div id="toast" class="hidden"></div>

  <script>
  (() => {
    const $ = (id) => document.getElementById(id);
    const USERS_PER_PAGE = 10;
    const state = { token: localStorage.getItem('beatlab_token') || '', users: [], overview: null, tab: 'overview', userPage: 1 };
    window.state = state;

    const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const ago = (ts) => {
      if (!ts) return 'never';
      const s = Math.max(0, Math.floor(Date.now()/1000) - ts);
      if (s < 60) return s + 's ago';
      if (s < 3600) return Math.floor(s/60) + 'm ago';
      if (s < 86400) return Math.floor(s/3600) + 'h ago';
      return Math.floor(s/86400) + 'd ago';
    };
    const date = (ts) => ts ? new Date(ts*1000).toLocaleString() : '—';
    const shortDate = (ts) => ts ? new Date(ts*1000).toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' }) : '—';
    const num = (n) => Number(n || 0).toLocaleString();
    const icon = (id) => '<svg><use href="#i-' + id + '"/></svg>';
    const HUES = ['#1ed760','#60a5fa','#a78bfa','#f5b54a','#f472b6','#34d399','#fb923c','#22d3ee'];
    const avatar = (name, cls) => {
      const n = String(name || '?');
      let h = 0; for (const c of n) h = (h * 31 + c.charCodeAt(0)) >>> 0;
      return '<div class="avatar' + (cls ? ' ' + cls : '') + '" style="background:' + HUES[h % HUES.length] + '">' + esc(n.charAt(0).toUpperCase()) + '</div>';
    };

    function toast(msg) {
      const el = $('toast'); el.textContent = msg; el.classList.remove('hidden');
      clearTimeout(el._t); el._t = setTimeout(() => el.classList.add('hidden'), 3500);
    }
    async function api(path, opts = {}) {
      const headers = Object.assign({ 'Content-Type':'application/json' }, opts.headers || {});
      if (state.token) headers.Authorization = 'Bearer ' + state.token;
      const r = await fetch(path, Object.assign({}, opts, { headers }));
      const text = await r.text();
      let data = {}; try { data = text ? JSON.parse(text) : {}; } catch { data = { error: text }; }
      if (!r.ok) {
        if (r.status === 401) gate('Sign in required', 'Your session is missing or expired.');
        if (r.status === 403) gate('Administrator only', 'This account is not listed in ADMIN_USERNAME.');
        throw new Error(data.error || ('Request failed (' + r.status + ')'));
      }
      return data;
    }
    function gate(title, text) {
      $('panel').classList.add('hidden'); $('gate').classList.remove('hidden');
      $('gate-title').textContent = title; $('gate-text').textContent = text;
    }
    window.api = api; window.toast = toast; window.esc = esc; window.ago = ago; window.date = date; window.gate = gate;

    // ---------- overview ----------
    function statCard(ic, tone, k, v, s) {
      return '<div class="card stat"><div class="stat-top"><span class="k">' + esc(k) + '</span><span class="ico ' + tone + '">' + icon(ic) + '</span></div>' +
        '<div><div class="v">' + esc(v) + '</div><div class="s">' + esc(s) + '</div></div></div>';
    }
    window.renderOverview = () => {
      const o = state.overview; if (!o) return;
      const people = [
        statCard('users', '', 'Active users', num(o.activeUsers), 'of ' + num(o.totalUsers) + ' total accounts'),
        statCard('monitor', 'info', 'Active sessions', num(o.sessions), 'signed-in web sessions'),
        statCard('key', 'violet', '2FA users', num(o.totpUsers), num(o.passkeys) + ' passkeys registered'),
        statCard('trash', o.deletedUsers ? 'danger' : 'warn', 'Pending deletion', num(o.deletedUsers), '7-day restore window'),
      ];
      const library = [
        statCard('music', '', 'Tracks', num(o.tracks), 'in library'),
        statCard('list', 'info', 'Playlists', num(o.playlists), 'across all accounts'),
        statCard('bolt', 'warn', 'Hot cache', Math.round(o.localCacheBytes / 1048576).toLocaleString() + ' MB', num(o.localCacheEntries) + ' files · ' + Math.round(o.cacheMaxBytes / 1073741824) + ' GB cap'),
        statCard('cloud', 'violet', 'Cool cache', o.remoteCacheEnabled ? Math.round(o.remoteCacheBytes / 1048576).toLocaleString() + ' MB' : 'Off', o.remoteCacheEnabled ? num(o.remoteCacheObjects) + ' objects' : 'Configure S3/R2 to enable'),
      ];
      $('overview-cards').innerHTML =
        '<div class="group-title">People</div><div class="stats">' + people.join('') + '</div>' +
        '<div class="group-title">Library &amp; storage</div><div class="stats">' + library.join('') + '</div>';
    };

    // ---------- users ----------
    window.setUserPage = (page) => { state.userPage = page; renderUsers(); };
    window.renderUsers = () => {
      const q = ($('user-search').value || '').toLowerCase().trim();
      const filtered = state.users.filter((u) => !q || u.username.toLowerCase().includes(q));
      $('users-count').textContent = num(state.users.length) + ' account' + (state.users.length === 1 ? '' : 's');
      const pages = Math.max(1, Math.ceil(filtered.length / USERS_PER_PAGE));
      state.userPage = Math.min(Math.max(1, state.userPage), pages);
      const start = (state.userPage - 1) * USERS_PER_PAGE;
      const rows = filtered.slice(start, start + USERS_PER_PAGE);
      if (!rows.length) {
        $('users-wrap').innerHTML = '<div class="empty">No matching users.</div>';
        $('users-pager').classList.add('hidden');
        return;
      }
      $('users-pager').classList.remove('hidden');
      let html = '<table><thead><tr><th>User</th><th>Status</th><th>Joined</th><th>2FA</th><th>Activity</th><th style="text-align:right">Actions</th></tr></thead><tbody>';
      for (const u of rows) {
        const status = u.deletedAt ? '<span class="pill del">Pending deletion</span>' : '<span class="pill on">Active</span>';
        const twofa = [
          u.totpEnabled ? '<span class="pill on plain">App</span>' : '',
          u.passkeys ? '<span class="pill on plain">' + u.passkeys + ' key' + (u.passkeys>1?'s':'') + '</span>' : '',
        ].filter(Boolean).join(' ') || '<span class="pill off plain">Off</span>';
        const self = u.username.toLowerCase() === (state.username || '').toLowerCase();
        const actions = [
          '<button class="mini" onclick="openResetPassword(' + u.id + ')">Reset password</button>',
          '<button class="mini" onclick="userAction(' + u.id + ',\'sessions\')">Sign out</button>',
          '<button class="mini" onclick="userAction(' + u.id + ',\'2fa\')">Reset 2FA</button>',
          u.deletedAt
            ? '<button class="mini" onclick="userAction(' + u.id + ',\'restore\')">Restore</button><button class="mini danger" onclick="userAction(' + u.id + ',\'purge\')">Purge</button>'
            : '<button class="mini danger" onclick="userAction(' + u.id + ',\'delete\')">Delete</button>',
        ].join('');
        html += '<tr>' +
          '<td><div class="user-cell">' + avatar(u.username) + '<div><div class="name">' + esc(u.username) + (u.isAdmin ? ' <span class="pill admin plain">Admin</span>' : '') + '</div><div class="sub">#' + u.id + ' · seen ' + esc(ago(u.lastSeen)) + '</div></div></div></td>' +
          '<td>' + status + '</td>' +
          '<td title="' + esc(date(u.created)) + '">' + esc(shortDate(u.created)) + '</td>' +
          '<td>' + twofa + '</td>' +
          '<td class="activity"><b>' + num(u.sessions) + '</b> session' + (u.sessions === 1 ? '' : 's') + '<div class="sub">' + num(u.listens) + ' tracks · ' + num(u.playlists) + ' playlists</div></td>' +
          '<td><div class="actions"><button class="mini" onclick="userDetail(' + u.id + ')">Details</button>' + (self ? '<span class="muted" style="font-size:12px;align-self:center">Your account</span>' : actions) + '</div></td></tr>';
      }
      $('users-wrap').innerHTML = html + '</tbody></table>';
      const from = start + 1;
      const to = Math.min(start + USERS_PER_PAGE, filtered.length);
      $('users-pager').innerHTML =
        '<span class="info">Showing ' + from + '–' + to + ' of ' + filtered.length + '</span><div class="btns">' +
        '<button class="mini" ' + (state.userPage <= 1 ? 'disabled' : '') + ' onclick="setUserPage(' + (state.userPage - 1) + ')">← Previous</button>' +
        '<span class="info" style="align-self:center;padding:0 4px">' + state.userPage + ' / ' + pages + '</span>' +
        '<button class="mini" ' + (state.userPage >= pages ? 'disabled' : '') + ' onclick="setUserPage(' + (state.userPage + 1) + ')">Next →</button></div>';
    };

    window.userAction = async (id, action) => {
      const labels = {
        sessions: 'Sign out all sessions of this user?',
        '2fa': 'Remove this user\'s authenticator, passkeys and recovery codes?',
        delete: 'Schedule this account for deletion? It can be restored for 7 days.',
        restore: 'Restore this account now?',
        purge: 'PERMANENTLY delete this account and all its data? This cannot be undone.',
      };
      if (!confirm(labels[action] || 'Continue?')) return;
      const routes = {
        sessions: '/sessions/revoke', '2fa': '/2fa/reset',
        delete: '/delete', restore: '/restore', purge: '/purge',
      };
      try {
        await api('/api/admin/users/' + id + routes[action], { method:'POST' });
        toast('Done');
        if (action === 'purge') state.users = state.users.filter((u) => u.id !== id);
        await load();
      } catch (e) { toast(e.message); }
    };

    window.closeModal = () => {
      state._lastResetPassword = '';
      $('modal').classList.add('hidden');
    };
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

    window.openResetPassword = (id) => {
      const u = state.users.find((x) => x.id === id);
      if (!u) return;
      state._lastResetPassword = '';
      $('modal-avatar').innerHTML = avatar(u.username, 'lg');
      $('modal-title').textContent = 'Reset password';
      $('modal-sub').textContent = u.username + ' · #' + u.id;
      $('modal-body').innerHTML =
        '<form onsubmit="submitResetPassword(event,' + u.id + ')">' +
          '<div class="field">' +
            '<label for="rp-pass">New password</label>' +
            '<div class="input-row">' +
              '<input id="rp-pass" type="password" autocomplete="new-password" maxlength="256" placeholder="Leave blank to generate a random password" />' +
              '<button type="button" class="btn" id="rp-toggle" onclick="toggleResetPass()">Show</button>' +
            '</div>' +
            '<div class="hint">Enter a new password (up to 256 characters), or leave blank to generate a random temporary password.</div>' +
          '</div>' +
          '<label class="check-row"><input id="rp-revoke" type="checkbox" checked /><span>Sign out all active sessions for this user</span></label>' +
          '<div class="modal-actions">' +
            '<button type="button" class="btn" onclick="closeModal()">Cancel</button>' +
            '<button type="submit" class="btn primary" id="rp-submit">Reset password</button>' +
          '</div>' +
        '</form>';
      $('modal').classList.remove('hidden');
      setTimeout(() => { const inp = $('rp-pass'); if (inp) inp.focus(); }, 0);
    };

    window.toggleResetPass = () => {
      const inp = $('rp-pass');
      const btn = $('rp-toggle');
      if (!inp || !btn) return;
      const show = inp.type === 'password';
      inp.type = show ? 'text' : 'password';
      btn.textContent = show ? 'Hide' : 'Show';
    };

    window.copyResetPass = async () => {
      const pw = state._lastResetPassword || '';
      if (!pw) return;
      try {
        await navigator.clipboard.writeText(pw);
        const btn = $('rp-copy');
        if (btn) {
          btn.textContent = 'Copied';
          setTimeout(() => { if ($('rp-copy')) $('rp-copy').textContent = 'Copy'; }, 2000);
        }
        toast('Password copied to clipboard');
      } catch {
        toast('Could not copy automatically — select the password manually');
      }
    };

    window.submitResetPassword = async (e, id) => {
      e.preventDefault();
      const u = state.users.find((x) => x.id === id);
      const btn = $('rp-submit');
      const raw = $('rp-pass') ? $('rp-pass').value : '';
      const revokeSessions = $('rp-revoke') ? $('rp-revoke').checked : true;
      if (btn) btn.disabled = true;
      try {
        const res = await api('/api/admin/users/' + id + '/password/reset', {
          method: 'POST',
          body: JSON.stringify({ newPassword: raw.length ? raw : null, revokeSessions }),
        });
        state._lastResetPassword = res.password || '';
        const who = u ? u.username : ('#' + id);
        const revokedMsg = res.revokedSessions
          ? ' ' + res.revokedSessions + ' active session' + (res.revokedSessions === 1 ? '' : 's') + ' signed out.'
          : '';
        $('modal-body').innerHTML =
          '<p style="margin:0 0 8px">Password updated for <strong>' + esc(who) + '</strong>.' + esc(revokedMsg) + '</p>' +
          '<p class="muted" style="margin:0">Share this ' + (res.generated ? 'temporary ' : '') + 'password with the user. It will not be shown again.</p>' +
          '<div class="secret-box"><code>' + esc(res.password) + '</code><button type="button" class="btn" id="rp-copy" onclick="copyResetPass()">Copy</button></div>' +
          '<div class="modal-actions"><button type="button" class="btn primary" onclick="closeModal()">Done</button></div>';
        toast('Password reset for ' + who);
        await load();
      } catch (err) {
        if (btn) btn.disabled = false;
        toast(err.message);
      }
    };
    window.userDetail = async (id) => {
      try {
        const d = await api('/api/admin/users/' + id);
        const u = d.user;
        const profile = d.profile || {};
        $('modal-avatar').innerHTML = avatar(u.username, 'lg');
        $('modal-title').textContent = u.username;
        $('modal-sub').textContent = '#' + u.id + ' · ' + (u.deletedAt ? 'Pending deletion' : 'Active') + (u.isAdmin ? ' · Administrator' : '');
        const tile = (k, v) => '<div class="detail"><div class="k">' + k + '</div><div class="v">' + esc(v) + '</div></div>';
        let html = '<div class="detail-grid">';
        html += tile('Joined', shortDate(u.created)) + tile('Last seen', ago(u.lastSeen));
        html += tile('2FA', [u.totpEnabled ? 'Authenticator' : '', u.passkeys ? u.passkeys + ' passkey(s)' : ''].filter(Boolean).join(' + ') || 'Off');
        html += tile('Recovery codes', u.recoveryLeft) + tile('Playlists', u.playlists) + tile('Starred tracks', u.stars);
        html += tile('Tracks played', u.listens) + tile('Active sessions', u.sessions);
        html += tile('Followers', (profile.followers || 0) + ' / ' + (profile.following || 0) + ' following');
        html += tile('Display name', profile.displayName || '—') + tile('Location', profile.location || '—');
        html += '</div><h4>Sessions</h4>';
        html += d.sessions.length
          ? d.sessions.map((s) => '<div class="list-row"><span>' + esc(s.userAgent || 'unknown') + ' <span class="muted">· ' + esc(s.ip || 'no IP') + '</span></span><span class="when">' + esc(ago(s.lastSeen)) + '</span></div>').join('')
          : '<p class="muted">No sessions.</p>';
        $('modal-body').innerHTML = html;
        $('modal').classList.remove('hidden');
      } catch (e) { toast(e.message); }
    };

    // ---------- tabs ----------
    const TABS = ['overview','users','cache','config'];
    const TITLES = {
      overview: ['Overview', 'A snapshot of your Beatlab server.'],
      users: ['Users', 'Manage accounts, sessions and two-factor authentication.'],
      cache: ['Cache', 'Hot and cool storage tiers for streamed audio.'],
      config: ['Configuration', 'Effective server settings (read-only).'],
    };
    function tabFromPath() {
      const part = location.pathname.replace(/\/+$/, '').split('/').pop();
      return TABS.includes(part) ? part : 'overview';
    }
    function showTab(tab, push = true) {
      if (!TABS.includes(tab)) tab = 'overview';
      state.tab = tab;
      document.querySelectorAll('.tab').forEach((b) => {
        const active = b.dataset.tab === tab;
        b.classList.toggle('active', active);
        if (active) b.setAttribute('aria-current', 'page');
        else b.removeAttribute('aria-current');
      });
      TABS.forEach((t) => $('tab-' + t).classList.toggle('hidden', t !== tab));
      $('page-title').textContent = TITLES[tab][0];
      $('page-sub').textContent = TITLES[tab][1];
      document.title = TITLES[tab][0] + ' · Beatlab Admin';
      if (push) {
        const path = '/admin/' + tab;
        if (location.pathname !== path) history.pushState({ tab }, '', path);
      }
    }
    window.showTab = showTab;

    // ---------- cache ----------
    window.backfillCache = async () => {
      if (!confirm('Upload all locally cached tracks to the cool cache now?')) return;
      try {
        await api('/api/admin/cache/backfill', { method: 'POST' });
        toast('Backfill started in the background');
      } catch (e) { toast(e.message); }
    };

    const pctOf = (used, max) => (max > 0 ? Math.min(100, (used / max) * 100) : 0);
    const bar = (used, max, marker, warn) => {
      const mark = marker > 0 ? '<i style="left:' + marker.toFixed(1) + '%"></i>' : '';
      return '<div class="usage-bar"><div class="usage-fill' + (warn ? ' warn' : '') + '" style="width:' + pctOf(used, max).toFixed(1) + '%"></div>' + mark + '</div>';
    };
    const statRow = (k, v) => '<div class="stat-row"><span class="label">' + k + '</span><span class="value">' + esc(v) + '</span></div>';
    const mb = (n) => ((n || 0) / 1048576).toFixed(1) + ' MB';
    const gb = (n) => ((n || 0) / 1073741824).toFixed(1) + ' GB';
    const tierHead = (ic, tone, title, sub, pill) =>
      '<div class="tier-head"><span class="ico ' + tone + '">' + icon(ic) + '</span><div><div class="t">' + title + '</div><div class="st">' + sub + '</div></div>' + pill + '</div>';

    function renderCache(o) {
      const hotPct = pctOf(o.localCacheBytes, o.cacheMaxBytes);
      const hotWarn = hotPct > 85;
      let hot = '<div class="card">';
      hot += tierHead('bolt', 'warn', 'Hot cache', 'Local disk', hotWarn ? '<span class="pill del">Nearly full</span>' : '<span class="pill on">Healthy</span>');
      hot += '<div class="big">' + mb(o.localCacheBytes) + '</div>';
      hot += bar(o.localCacheBytes, o.cacheMaxBytes, 0, hotWarn);
      hot += '<div class="progress-label"><span>' + hotPct.toFixed(1) + '% used</span><span>' + gb(o.cacheMaxBytes) + ' cap</span></div>';
      hot += statRow('Cached tracks', num(o.localCacheEntries));
      hot += statRow('Max per track', mb(o.maxTrackBytes));
      hot += '</div>';

      let cool;
      if (o.remoteCacheEnabled) {
        const highPct = o.remoteCacheMaxBytes > 0 ? (o.remoteCacheHighWaterBytes / o.remoteCacheMaxBytes) * 100 : 0;
        const coolPct = pctOf(o.remoteCacheBytes, o.remoteCacheMaxBytes);
        const coolWarn = highPct > 0 && coolPct >= highPct;
        cool = '<div class="card">';
        cool += tierHead('cloud', 'violet', 'Cool cache', 'S3 / R2 object storage', coolWarn ? '<span class="pill del">Above high-water</span>' : '<span class="pill on">Healthy</span>');
        cool += '<div class="big">' + mb(o.remoteCacheBytes) + '</div>';
        cool += bar(o.remoteCacheBytes, o.remoteCacheMaxBytes, highPct, coolWarn);
        cool += '<div class="progress-label"><span>' + coolPct.toFixed(1) + '% used</span><span>' + gb(o.remoteCacheMaxBytes) + ' cap · ' + highPct.toFixed(0) + '% high-water</span></div>';
        cool += statRow('Bucket / prefix', o.remoteCacheTarget);
        cool += statRow('Total objects', num(o.remoteCacheObjects));
        const kinds = o.remoteCacheByKind || [];
        if (kinds.length) {
          cool += '<div class="sub-label">By asset type</div>';
          for (const k of kinds) cool += statRow(esc(k.kind), num(k.objects) + ' objects · ' + mb(k.bytes));
        }
        cool += '<button class="btn" style="margin-top:16px" onclick="backfillCache()">' + icon('refresh') + 'Backfill from local cache</button>';
        cool += '</div>';
      } else {
        cool = '<div class="card">';
        cool += tierHead('cloud', 'violet', 'Cool cache', 'S3 / R2 object storage', '<span class="pill off">Off</span>');
        cool += '<div class="big" style="color:var(--dim)">Not configured</div>';
        cool += '<p class="muted" style="margin:12px 0 0">Set <code>BEATLAB_S3_BUCKET</code> and credentials to enable a larger cool tier.</p></div>';
      }
      $('cache-box').innerHTML = hot + cool;
    }

    // ---------- load ----------
    async function load() {
      try {
        const data = await api('/api/admin/overview');
        state.overview = data;
        $('head-user').textContent = state.username || 'admin';
        $('me-avatar').outerHTML = avatar(state.username || 'admin').replace('class="avatar"', 'id="me-avatar" class="avatar"');
        $('panel').classList.remove('hidden'); $('gate').classList.add('hidden');
        const [users, config] = await Promise.all([api('/api/admin/users'), api('/api/admin/config')]);
        state.users = users.users || [];
        renderOverview();
        renderCache(data);
        renderUsers();
        $('config-box').innerHTML = Object.entries(config).map(([k,v]) => {
          const label = k.replace(/([A-Z])/g,' $1').replace(/^./, (c) => c.toUpperCase());
          return '<div class="kv"><span>' + esc(label) + '</span><span>' + esc(Array.isArray(v) ? v.join(', ') || '—' : v) + '</span></div>';
        }).join('');
        return true;
      } catch (e) { toast(e.message); return false; }
    }
    window.reload = async () => { if (await load()) toast('Refreshed'); };

    async function boot() {
      if (!state.token) { gate('Sign in required', 'Sign in to the Beatlab player first, then open this page.'); return; }
      try {
        const s = await api('/api/admin/session');
        if (!s.admin) { gate('Administrator only', 'This account is not listed in ADMIN_USERNAME.'); return; }
        state.username = s.username;
        await load();
      } catch (e) { /* gate() already shown by api() */ }
    }
    window.signOut = () => {
      localStorage.removeItem('beatlab_token');
      state.token = '';
      gate('Signed out', 'Sign in to the Beatlab player, then reopen this page.');
    };

    // Tab navigation is backed by real URL paths (/admin/<tab>) so tabs can be
    // bookmarked and the browser's back/forward buttons work as expected.
    showTab(tabFromPath(), false);
    document.querySelectorAll('.tab').forEach((a) => {
      a.addEventListener('click', (e) => { e.preventDefault(); showTab(a.dataset.tab); });
    });
    window.addEventListener('popstate', () => showTab(tabFromPath(), false));
    boot();
  })();
  </script>
</body>
</html>
