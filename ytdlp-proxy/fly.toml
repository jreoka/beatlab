app = "beatlab-ytdlp-proxy"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  MAX_CONCURRENT_YTDLP = "2"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "15s"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "1gb"
